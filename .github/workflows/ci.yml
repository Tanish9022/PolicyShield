name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      STUB_AI: "true"
      STUB_RAZORPAY: "true"
      DB_PATH: ":memory:"
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Project
        run: npm run build

      - name: Lint
        run: npm run lint --if-present

      - name: Run Backend Tests (including 10-point adversarial suite)
        run: npm run test:all --workspace=services/backend

      - name: CI Safety Invariants
        run: npm run eval:ci --workspace=services/backend
