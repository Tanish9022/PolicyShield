name: 1,000-Case Security Benchmark

on:
  workflow_dispatch:

jobs:
  run-benchmark:
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      STUB_AI: "true"
      STUB_RAZORPAY: "true"
      DB_PATH: ":memory:"
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run 1,000-case Eval
        run: npx tsx services/backend/src/eval/benchmark.ts > benchmark-report.txt

      - name: Upload Report
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-report
          path: benchmark-report.txt
